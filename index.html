<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LOCKSTEP" />
  <meta name="format-detection" content="telephone=no" />
  <title>PROJECT LOCKSTEP — iPhone Test Build</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="gameShell">
    <canvas id="game" width="1280" height="720" aria-label="PROJECT LOCKSTEP combat arena"></canvas>

    <header class="hud topHud">
      <section class="fighter playerCard">
        <div class="name">YOU / COMMANDER</div>
        <div class="bar"><i id="playerHpBar"></i></div>
        <div class="numbers"><span id="playerHp">160 HP</span><strong id="energy">100 EN</strong></div>
      </section>

      <section class="centerHud">
        <div class="brand">PROJECT <strong>LOCKSTEP</strong></div>
        <div class="coreTrack"><i id="coreFill"></i><b id="coreMarker"></b></div>
        <div id="coreText">CORE NEUTRAL</div>
      </section>

      <section class="fighter enemyCard">
        <div class="name">ENEMY / COMMANDER</div>
        <div class="bar"><i id="enemyHpBar"></i></div>
        <div class="numbers"><span id="enemyHp">160 HP</span><strong>AI</strong></div>
      </section>
    </header>

    <section class="droneRack hud">
      <button class="droneBtn" data-drone="0"><small>D1</small><b>ASSAULT</b><span id="d0hp">70</span></button>
      <button class="droneBtn" data-drone="1"><small>D2</small><b>SHIELD</b><span id="d1hp">100</span></button>
      <button class="droneBtn" data-drone="2"><small>D3</small><b>INTERCEPT</b><span id="d2hp">55</span></button>
      <div id="commandHint">Tap a drone, then tap the arena to reposition it.</div>
    </section>

    <div id="leftStick" class="stick leftStick"><i></i></div>
    <div id="rightStick" class="stick rightStick"><i></i><span>FIRE</span></div>

    <div class="abilityRack hud">
      <button id="guardBtn" class="ability"><small>30 EN</small><b>GUARD</b><span id="guardCd">READY</span></button>
      <button id="dashBtn" class="ability primary"><small>24 EN</small><b>DASH</b><span id="dashCd">READY</span></button>
    </div>

    <div class="status hud">
      <span id="statusText">LIVE COMBAT / ZERO RNG</span>
      <span class="desktopHelp">WASD move · mouse aim/fire · Space dash · Shift guard</span>
    </div>

    <div id="result" class="result hidden">
      <div class="resultCard">
        <small>MATCH COMPLETE</small>
        <h1 id="resultTitle">VICTORY</h1>
        <p id="resultReason"></p>
        <button id="restart">RUN IT BACK</button>
      </div>
    </div>

    <div class="portraitWarning">Rotate your iPhone to landscape.</div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  </script>
</body>
</html>
